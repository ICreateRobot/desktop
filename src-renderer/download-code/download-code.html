  <style>
    /* 基本重置 */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; }

    /* 页面背景：浅绿色 */
    body {
      background: #f4fdfa; /* 浅绿色基调 */
      display: flex;
      justify-content: center;
      padding: 18px;
      min-height: 100vh;
    }

    /* 最外容器 */
    .panel {
      width: 440px;
      background: transparent;
      border-radius: 8px;
      padding: 10px;
      box-shadow: none;
    }

    /* 顶部串口选择 & 当前版本显示 */
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      color: #0b7c68;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 2px solid #66cbb3; /* 绿边 */
      background: transparent;
      font-size: 14px;
      color: #333;
    }

    /* 卡片容器 — 两列布局 */
    .cards-row {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    /* 单个卡片样式：灰色背景 */
    .card {
      flex: 1;
      background: #f6f8f8; /* 浅灰 */
      border: 2px solid rgba(31,150,120,0.15);
      border-radius: 8px;
      padding: 12px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 160px;
    }

    .card .title {
      font-size: 14px;
      color: #108769; /* 深绿标题 */
      font-weight: 700;
    }

    .card .subtitle {
      font-size: 12px;
      color: #0f6b5a;
      background: rgba(16,135,105,0.04);
      padding: 6px 8px;
      border-radius: 6px;
      display: inline-block;
    }

    .card .desc {
      margin-top: 8px;
      font-size: 12px;
      color: #108769;
      line-height: 1.5;
    }

    /* 下拉框在卡片内部 */
    .card select {
      margin-top: 8px;
      padding: 8px 10px;
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid #cddfd6;
      background: transparent;
    }

    /* 升级按钮风格（小绿按钮） */
    .card .btn {
      margin-top: auto; /* 自动占用上方空间，推到卡片底部 */
      /* margin-top: 10px; */
      padding: 8px 10px;
      border-radius: 6px;
      background: #22a37a;
      color: #fff;
      border: none;
      font-size: 14px;
      cursor: pointer;
      /* width: 50%; */
    }

    .card .btn:active { transform: translateY(1px); }

    /* 当只有一张卡片（Microbit 模式）时让它占满宽度 */
    .single {
      width: 100%;
    }

    /* 响应：窄屏时堆叠成一列 */
    @media (max-width: 520px) {
      .panel { width: 100%; padding: 8px; }
      .cards-row { flex-direction: column; }
    }

    /* 小提示样式 */
    .muted {
      font-size: 12px;
      color: #5c5c5c;
      margin-top: 6px;
    }
  /* 居中状态提示容器 */
  .status-tip {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    
    min-width: 260px;
    max-width: 80%;
    text-align: center;

    margin: 0;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.5;

    display: none; /* 默认隐藏 */
    z-index: 1000;
  }

  /* 信息提示 */
  .status-tip.info {
    background: rgba(34, 163, 122, 0.1);
    border: 1px solid rgba(34, 163, 122, 0.35);
    color: #0f6b5a;
  }

  /* 警告提示 */
  .status-tip.warning {
    background: rgba(255, 180, 0, 0.12);
    border: 1px solid rgba(255, 180, 0, 0.45);
    color: #8a5a00;
  }

    /* 加载端口列表（同步/异步兼容） */
    function loadPorts() {
      try {
        const ports = electronAPI.getPorts(); // 你原来的 API
        const sel = document.getElementById('portSelector');
        const current = sel.value;
        sel.innerHTML = `<option disabled selected>${t.strings['download-code.defaultSelect']}</option>`;
        if (Array.isArray(ports)) {
          ports.forEach(p => {
            const o = document.createElement('option');
            o.value = p;
            o.textContent = p;
            if (p === current) o.selected = true;
            sel.appendChild(o);
          });
        }
      } catch (err) {
        // 如果是异步函数返回 Promise
        if (err instanceof Promise) {
          // shouldn't happen, but just in case
        } else {
          // try async call
          (async () => {
            try {
              const ports = await electronAPI.getPorts();
              const sel = document.getElementById('portSelector');
              sel.innerHTML = `<option disabled selected>${t.strings['download-code.defaultSelect']}</option>`;
              (ports || []).forEach(p => {
                const o = document.createElement('option');
                o.value = p;
                o.textContent = p;
                sel.appendChild(o);
              });
            } catch(e) {}
          })();
        }
      }
    }

    function showToast(message, duration = 3000) {
      let container = document.getElementById('toast-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        Object.assign(container.style, {
          position: 'fixed',
          top: '20px',
          right: '20px',
          zIndex: 9999,
          display: 'flex',
          flexDirection: 'column',
          gap: '10px'
        });
        document.body.appendChild(container);
      }
      const toast = document.createElement('div');
      toast.textContent = message;
      Object.assign(toast.style, {
        background: 'linear-gradient(135deg, #66bb6a, #43a047)',
        color: '#fff',
        padding: '12px 22px',
        borderRadius: '12px',
        boxShadow: '0 3px 10px rgba(0,0,0,0.2)',
        opacity: '0',
        transform: 'translateY(-20px)',
        transition: 'opacity 0.3s ease, transform 0.3s ease',
        maxWidth: '300px'
      });
      container.appendChild(toast);
      requestAnimationFrame(() => {
        toast.style.opacity = '1';
        toast.style.transform = 'translateY(0)';
      });
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-20px)';
        setTimeout(() => {
          toast.remove();
          if (container.children.length === 0) {
            container.remove();
          }
        }, 300);
      }, duration);
    }

    async function loadFirmwareList() {
      let standardArr = [];
      let xiaozhiArr = [];
      let microbitArr = [];
    
      try {
        const res = await window.electronAPI.getFirmwareList();
    
        if (res && res.ok && res.data) {
          standardArr = res.data.standard || [];
          xiaozhiArr = res.data.xiaozhi || [];
          microbitArr = res.data.microbit || [];
        } else {
          showToast(t.strings['download-code.onlyLocalFirm']);
        }
      } catch (err) {
        showToast(t.strings['download-code.onlyLocalFirm']);
      }
    
      function populate(selectElem, arr,type) {
        selectElem.innerHTML = '';
    
        const localOpt = document.createElement('option');
        localOpt.value = JSON.stringify({ local: true });
        if(type=='stand'){
          localOpt.textContent = t.strings['download-code.localFirmware']+'(1.1.0)';
        }else{
          localOpt.textContent = t.strings['download-code.localFirmware']+'(1.0.0)';
        }
        
        selectElem.appendChild(localOpt);
    
        if (!arr || arr.length === 0) {
          const o = document.createElement('option');
          o.disabled = true;
          o.selected = true;
          o.textContent = '无可用版本';
          selectElem.appendChild(o);
          return;
        }
    
        arr.forEach(item => {
          const opt = document.createElement('option');
          opt.value = JSON.stringify({ folder: item.name });
          opt.textContent = item.version || item.name;
          selectElem.appendChild(opt);
        });
    
        selectElem.value = localOpt.value;
      }
    
      populate(standardSelect, standardArr,'stand');
      populate(xiaozhiSelect, xiaozhiArr,'xiaozhi');
      populate(microbitSelect, microbitArr,'microbit');
    }

          else if (type === 'xiaozhi') xiaozhiCommit.innerText = '';

    async function handleUpgrade(type) {
      const selectMap = {
        standard: standardSelect,
        xiaozhi: xiaozhiSelect,
        microbit: microbitSelect
      };
    
      const selected = selectMap[type]?.value;
      if (!selected) return alert(t.strings['download-code.firstSelectVersion']);
    
      const meta = JSON.parse(selected);
    
      const port = portSel.value;
     // if (type !== 'microbit') {
       // if (!port || port === t.strings['download-code.defaultSelect']) {
        //  return alert(t.strings['download-code.pleaseSelectPort']);
       // }
     // }

      if (!port || port === t.strings['download-code.defaultSelect']) {
        return alert(t.strings['download-code.pleaseSelectPort']);
      }
    
      try {
        if (meta.local) {
          await electronAPI.sendWho({
            who: type,
            port: port,
            filePath: null
          });
        } else {
          showToast(t.strings['download-code.startDownloadFirm']);
    
          const dlRes = await electronAPI.downloadFirmware(type, meta.folder);
          if (!dlRes?.ok) {
            showToast(t.strings['download-code.downloadFaild']);
            return;
          }
    
          showToast(t.strings['download-code.downloadSuccess']);
          await new Promise(r => setTimeout(r, 800));
    
          await electronAPI.sendWho({
            who: type,
            port:port,
            filePath: dlRes.data.downloaded
          });
        }
      } catch (err) {
        console.error(err);
      }
    }

    upgradeXiaoZhiBtn.addEventListener('click', async () => { await handleUpgrade('xiaozhi'); });

    upgradeMicrobitBtn.addEventListener('click', () => handleUpgrade('microbit'));

    async function loadDefaultCommits() {
      try {
        const map = {
          standard: {
            select: standardSelect,
            commitEl: standCommit
          },
          xiaozhi: {
            select: xiaozhiSelect,
            commitEl: xiaozhiCommit
          },
          microbit: {
            select: microbitSelect,
            commitEl: microbitCommit
          }
        };
    
        for (const type in map) {
          const { select, commitEl } = map[type];
          if (!select || !select.value) continue;
    
          const meta = JSON.parse(select.value);
          if (!meta.folder) continue;
    
          const res = await window.electronAPI.getFolderCommits(type, meta.folder);
          commitEl.innerText = res?.data?.[0]?.message || '';
        }
      } catch (err) {
        console.error("加载默认固件 commits 失败", err);
      }
    }
