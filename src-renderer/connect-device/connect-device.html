          function handleTabActivated(tabName) {
            if (tabName === 'wifi') {
              wifiInit();
              removeQr?.();
              return;
            }

            wifiCleanup();

            if (tabName === 'qr') {
              qrInit();
              return;
            }

            if (tabName === 'bluetooth') {
              bleInit();
              return;
            }

            if (tabName === 'serial') {
              serialInit();
              startPortMonitoring();

              // 防止重复 setInterval
              if (serialTimer) clearInterval(serialTimer);

              serialTimer = setInterval(() => {
                if (!isConnecting) {
                  serialInit();
                }
              }, 2000);

              return;
            }

          function renderTabs() {
            hasEnabledTab = false;
            document.getElementById('default-page').classList.remove('active');

            tabs.forEach(tab => {
              const tabName = tab.dataset.tab;
              const page = document.getElementById(tabName);

              // ① 清空状态
              tab.classList.remove('active', 'disabled');
              page.classList.remove('active');

              // ② 禁用 tab
              if (!tabEnabledMap[tabName]) {
                tab.classList.add('disabled');
                return;
              }

              // ③ 激活第一个可用 tab
              if (!hasEnabledTab) {
                tab.classList.add('active');
                page.classList.add('active');
                handleTabActivated(tabName);
                hasEnabledTab = true;
              }
            });

            // ④ 全禁用兜底页
            if (!hasEnabledTab) {
              pages.forEach(p => p.classList.remove('active'));
              document.getElementById('default-page').classList.add('active');
            }
          }

          tabs.forEach(tab => {
            tab.addEventListener('click', () => {
              const tabName = tab.dataset.tab;

              if (!tabEnabledMap[tabName]) return;

              // 切换 active
              tabs.forEach(t => t.classList.remove('active'));
              pages.forEach(p => p.classList.remove('active'));

              tab.classList.add('active');
              document.getElementById(tabName).classList.add('active');

              handleTabActivated(tabName);
            });
          });
          renderTabs();

          function showToast(message, duration = 3000) {
              // 如果 toast 容器不存在，则创建一个
              let container = document.getElementById('toast-container');
              if (!container) {
                  container = document.createElement('div');
                  container.id = 'toast-container';
                  Object.assign(container.style, {
                      position: 'fixed',
                      top: '20px',
                      right: '20px',
                      zIndex: '9999',
                      display: 'flex',
                      flexDirection: 'column',
                      gap: '10px'
                  });
                  document.body.appendChild(container);
              }
          
              // 创建 toast 元素
              const toast = document.createElement('div');
              if(message == '请填写完整 Wi-Fi 信息！'){
                toast.textContent=strings['connect-device.showToast.wifiinfo']
              }else if(message == '热点名称至少8位！'){
                toast.textContent=strings['connect-device.showToast.wifiNameLen']
              }else if(message == '点击图片或按ESC键退出全屏'){
                toast.textContent=strings['connect-device.showToast.escFullScreen']
              }else if(message == '连接成功'){
                toast.textContent=strings['connect-device.showToast.connectSuccess']
              }else if(message == '连接超时，请重试'){
                toast.textContent=strings['connect-device.showToast.connectTimeout']
              }else if(message == '已断开'){
                toast.textContent=strings['connect-device.showToast.disConnect']
              }else if(message =='断开失败'){
                toast.textContent=strings['connect-device.showToast.disconnectFailed']
              }
              // toast.textContent = message;
          
              // 样式设置
              Object.assign(toast.style, {
                  background: '#333',
                  color: '#fff',
                  padding: '10px 20px',
                  borderRadius: '8px',
                  boxShadow: '0 2px 8px rgba(0,0,0,0.2)',
                  opacity: '0',
                  transform: 'translateY(-20px)',
                  transition: 'opacity 0.3s ease, transform 0.3s ease',
                  maxWidth: '300px'
              });
          
              // 添加 toast 到容器
              container.appendChild(toast);
          
              // 强制触发重绘以启用动画
              requestAnimationFrame(() => {
                  toast.style.opacity = '1';
                  toast.style.transform = 'translateY(0)';
              });
          
              // 3秒后移除
              setTimeout(() => {
                  toast.style.opacity = '0';
                  toast.style.transform = 'translateY(-20px)';
                  setTimeout(() => {
                      toast.remove();
                      // 若容器内无子元素则移除容器
                      if (container.children.length === 0) {
                          container.remove();
                      }
                  }, 300); // 等动画结束
              }, duration);
          }

              const timer = setTimeout(() => {
                // 超时处理
                responseQueue = responseQueue.filter(item => item.resolve !== resolve);
                reject(new Error(`等待超时（>${timeoutMs}ms 未收到数据）`));

              responseQueue.push({ resolve, reject, timer });
            });

          function crc16(arr) {
            let crc = 0xFFFF;
            for (let i = 0; i < arr.length; i++) {
              crc ^= arr[i];
              for (let j = 0; j < 8; j++) {
                if (crc & 0x0001) {
                  crc = (crc >> 1) ^ 0xA001;
                } else {
                  crc >>= 1;
                }
                crc &= 0xFFFF; // 保持 16 位
              }
            }
            return crc;
          }
        function splitUint8Array(uint8Array, chunkSize = 500) {
            const chunks = [];
            for (let i = 0; i < uint8Array.length; i += chunkSize) {
              let slice = uint8Array.slice(i, i + chunkSize);

              // 新包长度 = 头(2) + 数据(N) + CRC16(2)
              let packet = new Uint8Array(slice.length + 4);

              // 设置包头
              packet[0] = 0xaa;
              packet[1] = 0x02;

              // 复制数据
              packet.set(slice, 2);

              // 计算 CRC16（头 + 数据）
              let crc = crc16(packet.slice(0, packet.length - 2));

              // 填充 CRC16 高低字节
              packet[packet.length - 2] = (crc >> 8) & 0xFF;
              packet[packet.length - 1] = crc & 0xFF;

              chunks.push(packet);
            }
            return chunks;
          }

        function startPortMonitoring() {
            setInterval(() => {
                const status = connect.whatPortConnect();
                if (status.port !== currentConnectedPort && !isConnecting) {
                  console.log('----')
                    Object.keys(portStatusMap).forEach(port => {
                        portStatusMap[port] = (port === status.port);
                    });
                    currentConnectedPort = status.port;
                    updateAllPortUI();
                }
            }, 2000);
        }
