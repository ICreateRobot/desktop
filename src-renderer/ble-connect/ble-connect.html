        --bg: #f0fdf4;
        --card-bg: #ffffff;
        --radius: 16px;
        --shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      }

      body {
        margin: 0;

        background: var(--bg);
        color: var(--text-dark);
      }

      header {
        background: var(--primary);

        text-align: center;
        padding: 20px 15px;
        border-bottom-left-radius: var(--radius);
        border-bottom-right-radius: var(--radius);

      }

      }

      }

      main {

        padding: 0 20px;
      }

      .card {
        background: var(--card-bg);
        border-radius: var(--radius);
        padding: 25px;
        box-shadow: var(--shadow);
        margin-bottom: 25px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        justify-content: center;
        margin-bottom: 20px;
      }

      button {
        padding: 12px 28px;
        font-size: 1rem;
        border: none;
        border-radius: var(--radius);
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: 500;
      }

      .btn-primary {
        background: var(--primary);
        color: var(--text-light);
      }

      .btn-primary:hover {
        background: var(--primary-light);
        transform: translateY(-2px);
      }

      .btn-danger {
        background: var(--danger);
        color: var(--text-light);
      }

      .btn-danger:hover {
        background: hsl(0, 75%, 40%);
        transform: translateY(-2px);
      }

      ul#device {

        margin: 0;
        padding: 0;
      }

        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: var(--radius);
        padding: 15px 20px;

        justify-content: space-between;

        box-shadow: var(--shadow);

        text-align: center;
      }

        function createPromiseForRobot(timeoutMs = 6000) {
          return new Promise((resolve, reject) => {
            const timer = setTimeout(() => {
              // 超时处理
              responseQueue = responseQueue.filter(item => item.resolve !== resolve);
              reject(new Error(`等待超时（>${timeoutMs}ms 未收到数据）`));
            }, timeoutMs);

            // 推入队列，由全局监听处理
            responseQueue.push({ resolve, reject, timer });
          });
        }

        function crc16(arr) {
          // let crc = 0xFFFF; // 初始值
          // for (let i = 0; i < arr.length; i++) {
          //   crc ^= (arr[i] << 8);
          //   for (let j = 0; j < 8; j++) {
          //     if (crc & 0x8000) {
          //       crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
          //     } else {
          //       crc = (crc << 1) & 0xFFFF;
          //     }
          //   }
          // }
          // return crc;
          let crc = 0xFFFF;
          for (let i = 0; i < arr.length; i++) {
            crc ^= arr[i];
            for (let j = 0; j < 8; j++) {
              if (crc & 0x0001) {
                crc = (crc >> 1) ^ 0xA001;
              } else {
                crc >>= 1;
              }
              crc &= 0xFFFF; // 保持 16 位
            }
          }
          return crc;
        }
       function splitUint8Array(uint8Array, chunkSize = 500) {
          const chunks = [];
          for (let i = 0; i < uint8Array.length; i += chunkSize) {
            let slice = uint8Array.slice(i, i + chunkSize);

            // 新包长度 = 头(2) + 数据(N) + CRC16(2)
            let packet = new Uint8Array(slice.length + 4);

            // 设置包头
            packet[0] = 0xaa;
            packet[1] = 0x02;

            // 复制数据
            packet.set(slice, 2);

            // 计算 CRC16（头 + 数据）
            let crc = crc16(packet.slice(0, packet.length - 2));

            // 填充 CRC16 高低字节
            packet[packet.length - 2] = (crc >> 8) & 0xFF;
            packet[packet.length - 1] = crc & 0xFF;

            chunks.push(packet);
          }
          return chunks;
        }

        function onDisconnected(event){

        window.addEventListener('DOMContentLoaded', () => {

        async function testIt () {
          if(currentExtension==1){
            if(!device || !device.gatt.connected){
              console.log(navigator);
        
              device = await navigator.bluetooth.requestDevice({
                filters: [{ services: ['108f94d5-570b-4a6c-9a47-12f428f362e6'] }],
                optionalServices: ['108f94d5-570b-4a6c-9a47-12f428f362e6', '4e8d78da-f40e-4983-9cc6-9b888aab1800']
              }).catch(e=>{
                console.log(e);
                
              })

              console.log('开始');
              
              server = await device.gatt.connect();
              console.log('结束');
              // await new Promise(resolve => setTimeout(resolve, 5000));
              
              //1551BBE8-2765-11EE-BE56-0242AC120002
              //1551bbe8-2765-11ee-be56-0242ac120002
              try{
                service = await server.getPrimaryService('108f94d5-570b-4a6c-9a47-12f428f362e6');
                serviceDown = await server.getPrimaryService('4e8d78da-f40e-4983-9cc6-9b888aab1800');
                characteristicWrite = await service.getCharacteristic('20bc2441-0aed-48d0-81bd-68f28d02c2a6');
                characteristicRead = await service.getCharacteristic('407ccc3a-7ed4-42fc-b66f-899d82e1a695');
                characteristicWriteDown = await serviceDown.getCharacteristic('1551bbe8-2765-11ee-be56-0242ac120002');
                characteristicReadDown = await serviceDown.getCharacteristic('1551bbe8-2765-11ee-be56-0242ac120002');
                device.addEventListener('gattserverdisconnected', onDisconnected);
                await characteristicRead.startNotifications()
                await characteristicReadDown.startNotifications()
                // console.log(characteristicWrite.properties.writeValue);
                getStatus()
                characteristicReadDown.addEventListener('characteristicvaluechanged', (event)=>{
                  // console.log('有返回');
                  
                  console.log(event.target.value);

                  if(event.target.value.getUint8(0)==8 && event.target.value.getUint8(1)==254){
                    bleAPI.sendCodeProsser(false)
                  }else if(event.target.value.getUint8(0)==7 && event.target.value.getUint8(1)==4){
                    bleAPI.sendCodeProsser(true)
                  }
                  
                })
                


              
                const uint8Array = new Uint8Array([5]);
                await characteristicWriteDown.writeValue(uint8Array.buffer)
                // electronAPI.sendCharacteristic(characteristicRead,characteristicWrite)
                // window.electronAPI.sendCharacteristic(JSON.stringify(service),JSON.stringify(characteristicWrite))

                document.getElementById(device.name).remove()
                document.getElementById('device-name').innerHTML = device.name || `ID: ${device.id}`

                if(server){
                  fetch('http://localhost:3000/set-ble', {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'text/plain'
                    },
                    body: '0'
                  })
                  .then(response => response.text())
                  .then(data => {
                    console.log('服务器响应:', data);
                  })
                  .catch(error => {
                    console.error('错误:', error);
                  });
                }
              }catch(err){
                // alert(err)
                // alert('蓝牙连接异常断开，请重新连接')
                if(String(err).includes('NetworkError')){
                  alert(strings['ble-connect.catchDisConnect'])

                }
                // device=null
              }
            }else{
              alert(strings['ble-connect.disConnectFirst'])
            }
            
            
          }else if(currentExtension==2){
            if(!deviceRobot || !deviceRobot.gatt.connected){
              deviceRobot = await navigator.bluetooth.requestDevice({
                filters: [{ services: ['0000fff0-0000-1000-8000-00805f9b34fb'] }],
                optionalServices: ['00001800-0000-1000-8000-00805f9b34fb', '0000fff0-0000-1000-8000-00805f9b34fb']
              }).catch(e=>{
                console.log(e);
                
              })

              console.log('开始');
              
              // serverRobot = await deviceRobot.gatt.connect();
              if (!deviceRobot.gatt.connected) {
                serverRobot = await deviceRobot.gatt.connect();
              }
              console.log('结束');
              

              
              //1551BBE8-2765-11EE-BE56-0242AC120002
              //1551bbe8-2765-11ee-be56-0242ac120002
              console.log(serverRobot)
              console.log(serverRobot.connected)
              try{
                console.log(serverRobot.connected)
                serviceRobot = await serverRobot.getPrimaryService('0000fff0-0000-1000-8000-00805f9b34fb');
                console.log('-------------------')
                characteristicWriteRobot = await serviceRobot.getCharacteristic('0000fff1-0000-1000-8000-00805f9b34fb');
                characteristicReadRobot = await serviceRobot.getCharacteristic('0000fff2-0000-1000-8000-00805f9b34fb');
                characteristicReadSensorRobot=await serviceRobot.getCharacteristic('0000fff3-0000-1000-8000-00805f9b34fb');
                deviceRobot.addEventListener('gattserverdisconnected', onDisconnected);
                await characteristicReadRobot.startNotifications()
                await characteristicReadSensorRobot.startNotifications()

                characteristicReadRobot.addEventListener('characteristicvaluechanged',globalEventListener)
                
                
                // characteristicReadRobot.addEventListener('characteristicvaluechanged',(event)=>{
                //   const value = event.target.value;
                //   const state = value.getUint8(0);
                //   console.log(state)
                //   console.log(value)
                //   console.log(event)
                //   // window.bleAPI.sendRobotSenor({
                //   //   type:'senor',
                //   //   data:event.target.value
                //   // })
                // })
                characteristicReadSensorRobot.addEventListener('characteristicvaluechanged',(event)=>{
                  // console.log(event.target.value)
                  // let value = event.target.value
                  // let sensor=new Uint8Array(value.buffer);
                  // let sensorArray = Array.from(sensor);
                  // console.log(event.target.value);
                  let value = event.target.value;
                  let sensor = new Uint8Array(value.buffer);

                  // 把字节数组转成字符串
                  let jsonStr = new TextDecoder("utf-8").decode(sensor);
                  // console.log("📩 收到 JSON 字符串:", jsonStr);

                  let sensorArray = [];
                  try {
                    // 解析 JSON
                    sensorArray = JSON.parse(jsonStr);
                    // console.log("✅ 解析后的数组:", sensorArray);
                  } catch (e) {
                    console.error("❌ JSON 解析失败:", e);
                  }
                  // console.log(sensorArray)
                  window.bleAPI.sendRobotSenor({
                    type:'senor',
                    data:sensorArray
                  })
                })

                // console.log(window.bleAPI.getCurrentMode())
                // 转成 Uint8Array
                let raw;
                if(!window.bleAPI.getCurrentMode()){
                  raw = new Uint8Array([0xcc,0x01]);
                }else{
                  raw = new Uint8Array([0xcc,0x02]);
                }

                // 计算 CRC16
                let crc = crc16(raw);

                // 新建数组，长度 = 原始数据 + 2
                let packet = new Uint8Array(raw.length + 2);
                packet.set(raw, 0);
                packet[raw.length] = (crc >> 8) & 0xFF;  // 高字节
                packet[raw.length + 1] = crc & 0xFF;     // 低字节
                console.log(packet)

                await characteristicWriteRobot.writeValue(packet.buffer)

                console.log(deviceRobot.name)

                  });

                }
                
              }
            }else{
              alert(strings['ble-connect.disConnectFirst'])
            }
            
            
          }
          
          
        }

        let responseQueue = []; // 等待响应的队列
        // 全局监听器
        function globalEventListener(event) {
          const value = event.target.value;
          const arr = new Uint8Array(value.buffer);
          // console.log("📩 收到数据:", arr);

          const state1 = arr[0]; // 第一个字节（硬件返回）

          // ✅ 新增：无论是否队列匹配，都把 state 发出去
          if (window.bleAPI && typeof window.bleAPI.sendRobotSenor === "function") {
            // console.log('发送了')
            window.bleAPI.sendRobotSenor({
              type: "state",
              data: state1
            });
          }

          // 如果队列里有等待的 promise，取出处理
          if (responseQueue.length > 0) {
            const { resolve, reject } = responseQueue.shift();
            const state = arr[0]; // 第一个字节
            console.log(state)

            if (state === 0x00) {  // 48 十进制
              resolve(true);
            } else {
              reject(new Error(`收到错误状态码: ${state}`));
            }
          } else {
            // console.warn("⚠️ 收到未匹配的响应:", arr);
          }
        }

      window.bleAPI.bluetoothPairingRequest((event, details) => {
        console.log('执行了');
        
        const response = {}

        switch (details.pairingKind) {
          case 'confirm': {
            response.confirmed = window.confirm(`Do you want to connect to device ${details.deviceId}?`)
            break
          }
          case 'confirmPin': {
            response.confirmed = window.confirm(`Does the pin ${details.pin} match the pin displayed on device ${details.deviceId}?`)
            break
          }
          case 'providePin': {
            const pin = window.prompt(`Please provide a pin for ${details.deviceId}.`)
            if (pin) {
              response.pin = pin
              response.confirmed = true
            } else {
              response.confirmed = false
            }
          }
        }

        window.bleAPI.bluetoothPairingResponse(response)
      })
